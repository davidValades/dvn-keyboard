name: Build README banner

on:
  push:
    paths:
      - '.banner-build/**'
      - '.github/workflows/build-banner.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build banner
        shell: bash
        run: |
          mkdir -p assets/images
          cat .banner-build/*.txt | base64 -d > assets/images/dvn-65-banner.webp
          test "$(stat -c%s assets/images/dvn-65-banner.webp)" -eq 95126

      - name: Commit banner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/dvn-65-banner.webp
          git commit -m "docs: rebuild DVN-65 banner asset" || exit 0
          git push
